apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "craton-hsm.fullname" . }}
  labels:
    {{- include "craton-hsm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "craton-hsm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gRPC API: labelled client pods only. The label is a coarse filter —
    # mutual TLS is the actual trust boundary.
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.clientPodLabels | nindent 14 }}
          {{- with .Values.networkPolicy.clientNamespaceSelector }}
          namespaceSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - port: {{ regexFind "[0-9]+$" .Values.daemon.bind | int }}
          protocol: TCP
    # Health endpoint (grpc.health.v1 only, no HSM API) for kubelet probes,
    # whose source address is the node and cannot be selected portably.
    - ports:
        - port: {{ int .Values.daemon.healthPort }}
          protocol: TCP
  # The daemon makes no outbound connections (CRLs are read from files; there
  # is no OCSP client). Only DNS is allowed.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
