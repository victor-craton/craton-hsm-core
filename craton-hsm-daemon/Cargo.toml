[package]
name = "craton-hsm-daemon"
version = "0.3.0"
edition = "2021"
description = "Craton HSM network daemon — gRPC over TLS for remote HSM access"
license = "Apache-2.0"
repository = "https://github.com/craton-co/craton-hsm-core"

[[bin]]
name = "craton-hsm-daemon"
path = "src/main.rs"

[dependencies]
craton-hsm = { path = ".." }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-health = "0.14"
tower = { version = "0.5", features = ["limit", "load-shed"] }
prost = "0.14"
# Only the ring provider is linked (no aws-lc-rs) — smaller binary and FIPS boundary.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
zeroize = "1"
parking_lot = "0.12"
async-stream = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14"
