[package]
name = "craton-hsm-daemon"
version = "0.3.0"
edition = "2021"
description = "Craton HSM network daemon — gRPC over TLS for remote HSM access"
license = "Apache-2.0"
repository = "https://github.com/craton-co/craton-hsm-core"
# Same MSRV as the craton-hsm library it links (A3-08).
rust-version = "1.89"
# Distributed only as release binaries / container image, never on crates.io
# (also required by cargo-deny `wildcards = "deny"` for the path dependency).
publish = false

[[bin]]
name = "craton-hsm-daemon"
path = "src/main.rs"

[dependencies]
craton-hsm = { path = ".." }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-health = "0.14"
tower = { version = "0.5", features = ["limit", "load-shed"] }
prost = "0.14"
# Only the ring provider is linked (no aws-lc-rs) — smaller binary and FIPS boundary.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pemfile = "2"
# Compile-time log level caps belong to the binary, not the library (A3-26).
tracing = { version = "0.1", features = ["max_level_info", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
zeroize = "1"
parking_lot = "0.12"
async-stream = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14"
