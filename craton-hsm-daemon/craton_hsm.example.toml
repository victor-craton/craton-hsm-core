# Craton HSM daemon — example configuration.
#
# Shipped in the container image as /etc/craton-hsm/craton_hsm.toml. Mount
# your own file over it in production. Unknown keys are rejected at startup.
#
# Relative paths ([token] storage_path, [audit] log_path) are resolved
# against the working directory (/data in the container); the core rejects
# absolute paths.

[token]
label = "Craton HSM Token"
storage_path = "craton_hsm_store"
max_sessions = 100
max_rw_sessions = 10
# Enable once the core's persistent store is available; the daemon refuses
# CKA_TOKEN=true objects while HSM state is ephemeral.
persist_objects = false

[security]
pin_min_length = 8
pin_max_length = 64
max_failed_logins = 10

[audit]
enabled = true
log_path = "craton_hsm_audit.jsonl"
log_level = "all"

[algorithms]
fips_approved_only = false
enable_pqc = false

[daemon]
bind = "0.0.0.0:5696"

# TLS 1.3 with mandatory client certificates (mTLS).
tls_cert = "/etc/craton-hsm-tls/tls.crt"
tls_key = "/etc/craton-hsm-tls/tls.key"
tls_client_ca = "/etc/craton-hsm-client-ca/ca.crt"
# One or more CRLs (PEM or DER); re-read every tls_client_crl_reload_secs.
# tls_client_crl = ["/etc/craton-hsm-crl/client.crl"]
# tls_client_crl_reload_secs = 300

# SHA-256 fingerprints of administrator client certificates (InitToken,
# SO login, InitPin):  openssl x509 -in admin.crt -outform DER | sha256sum
admin_client_cert_sha256 = []

# Plaintext grpc.health.v1 endpoint for container health checks only.
health_bind = "127.0.0.1:5697"

# Resource limits (defaults shown).
# max_request_bytes = 1048576
# max_response_bytes = 4194304
# max_random_length = 65536
# max_digest_length = 1047552
# max_connections = 128
# max_connections_per_ip = 32
# max_inflight_requests = 32
# max_concurrent_streams = 16
# request_timeout_secs = 30
# handshake_timeout_secs = 10
# connection_idle_timeout_secs = 300
# http2_keepalive_interval_secs = 30
# http2_keepalive_timeout_secs = 10
# max_sessions_per_client = 16
# session_idle_timeout_secs = 900
# max_objects_per_client = 1024
# max_login_attempts = 5
# login_cooldown_secs = 60
# max_blocking_tasks = 0   # 0 = number of CPUs
