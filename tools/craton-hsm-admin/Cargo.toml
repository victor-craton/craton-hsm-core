[package]
name = "craton-hsm-admin"
version = "0.3.0"
edition = "2021"
description = "Admin CLI for Craton HSM — token init, key management, PIN operations"
license = "Apache-2.0"
repository = "https://github.com/craton-co/craton-hsm-core"
# Same MSRV as the craton-hsm library it links (A3-08).
rust-version = "1.89"
# Distributed only as release binaries / container image, never on crates.io
# (also required by cargo-deny `wildcards = "deny"` for the path dependency).
publish = false

[[bin]]
name = "craton-hsm-admin"
path = "src/main.rs"

[dependencies]
craton-hsm = { path = "../.." }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
fs2 = "0.4"
rand = "0.8"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = "0.3"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
