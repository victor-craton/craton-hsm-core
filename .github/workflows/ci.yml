name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Re-used by the release workflow as a mandatory gate (A3-03).
  workflow_call:

# Least privilege by default (A3-10). Jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match rust-toolchain.toml (checked by the `fmt-check` job, A3-08).
  RUST_TOOLCHAIN: "1.94.1"
  # Declared MSRV — must match `rust-version` in Cargo.toml.
  RUST_MSRV: "1.89.0"
  # Pinned protoc for the daemon build script (A3-27).
  PROTOC_VERSION: "36.2"

jobs:
  # ── Fast gate: formatting + CI self-consistency checks ──
  fmt-check:
    name: Format & CI consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Toolchain pin matches rust-toolchain.toml and Cargo.toml
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          if [ "$pinned" != "$RUST_TOOLCHAIN" ]; then
            echo "::error file=rust-toolchain.toml::channel '$pinned' != RUST_TOOLCHAIN '$RUST_TOOLCHAIN' in ci.yml"
            exit 1
          fi
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$RUST_MSRV" in
            "$msrv"|"$msrv".*) ;;
            *) echo "::error file=Cargo.toml::rust-version '$msrv' != RUST_MSRV '$RUST_MSRV' in ci.yml"; exit 1 ;;
          esac

      - name: Every integration test file is run by CI
        # Guards against new tests/*.rs files that are silently never executed.
        run: |
          set -euo pipefail
          missing=0
          for f in tests/*.rs; do
            name=$(basename "$f" .rs)
            if ! grep -qE -- "--test ${name}\$" .github/workflows/ci.yml; then
              echo "::error file=$f::integration test '$name' is not listed in .github/workflows/ci.yml"
              missing=1
            fi
          done
          exit $missing

  # ── Build & Test: full OS matrix on main/release, Ubuntu-only on PRs ──
  #
  # Tests are split into two groups for performance:
  #   1. Parallel-safe: pure crypto / unit tests with no global state
  #   2. Serial: PKCS#11 ABI tests sharing a process-wide singleton
  #
  # PKCS#11 §5.10 mandates one C_Initialize/C_Finalize per process, so ABI
  # tests must run with --test-threads=1. Pure crypto tests are stateless and
  # safe to parallelize. The `fmt-check` job verifies that every tests/*.rs
  # file appears in one of the two lists below.
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: fmt-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned runner images = the tested operational environments listed in
        # docs/tested-platforms.md and docs/fips-140-3-certification.md §5 (A1-19).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "windows-2025", "macos-15"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run parallel-safe tests (pure crypto, no global state)
        run: >-
          cargo test --locked --lib
          --test crypto_vectors
          --test drbg_tests
          --test concurrent_stress
          --test audit_and_integrity
          --test integrity_tests
          --test multi_slot
          --
          --test-threads=8

      - name: Run PKCS#11 ABI tests (serial — global singleton)
        # `zeroization` runs here (serially) because it inspects memory after
        # drop and is sensitive to allocator reuse by concurrent tests (A3-21).
        run: >-
          cargo test --locked
          --test attribute_management
          --test attribute_validation
          --test backup_restore
          --test concurrent_session_stress
          --test crypto_vectors_phase2
          --test digest_abi
          --test fips_approved_mode
          --test key_derivation_abi
          --test key_lifecycle_abi
          --test key_wrapping_abi
          --test multipart_encrypt_decrypt
          --test multipart_sign_verify
          --test negative_edge_cases
          --test operation_state
          --test pairwise_consistency
          --test persistence
          --test pkcs11_compliance
          --test pkcs11_compliance_extended
          --test pkcs11_conformance
          --test pkcs11_error_paths
          --test pkcs11_info_functions
          --test pqc_abi_comprehensive
          --test pqc_phase3
          --test random_and_session
          --test rsa_abi_comprehensive
          --test security_properties
          --test session_state_machine
          --test supplementary_functions
          --test zeroization
          --
          --test-threads=1

      - name: Run doc-tests
        run: cargo test --locked --doc -p craton-hsm

      - name: Run workspace member tests
        run: >-
          cargo test --locked
          -p craton-hsm-admin
          -p pkcs11-spy
          -p craton-hsm-daemon
          --
          --test-threads=1

  # ── Feature matrix: the FIPS / AWS-LC configurations must at least build ──
  # (A1-20: CI previously never compiled `fips` or `awslc-backend`.)
  features:
    name: Feature build (${{ matrix.features }})
    needs: fmt-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "fips"
          - "awslc-backend"
          - "fips,awslc-backend"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          key: features-${{ matrix.features }}

      - name: Build library and tests with --features ${{ matrix.features }}
        # aws-lc-fips-sys needs cmake, Go and clang, which ubuntu-latest provides.
        run: cargo build --locked -p craton-hsm --features "${{ matrix.features }}" --all-targets

  # ── MSRV: the declared rust-version must actually build (A3-08) ──
  msrv:
    name: MSRV check
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - name: cargo check with the MSRV toolchain
        # `+toolchain` overrides rust-toolchain.toml for this invocation.
        run: cargo +${{ env.RUST_MSRV }} check --locked --workspace

  # ── Clippy: blocking for correctness + suspicious ──
  lint:
    name: Clippy
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run Clippy
        # Deny correctness and suspicious lints (safety-critical for a crypto
        # project) on all targets. Other categories remain warnings until the
        # pre-existing issues are resolved. `clippy::not_unsafe_ptr_arg_deref`
        # (safe `extern "C"` fns dereferencing raw pointers) and
        # `clippy::incompatible_msrv` are deliberately NOT allowed any more
        # (A3-14, A3-08).
        run: >-
          cargo clippy --locked --workspace --all-targets --
          -D clippy::correctness -D clippy::suspicious
          -A deprecated

  # ── Semver Checks: catch accidental breaking changes ──
  semver-checks:
    name: Semver Compliance
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check semver compliance
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: craton-hsm
        continue-on-error: true  # Reported but non-blocking until 1.0

  # ── Miri: undefined-behavior checks ──
  #
  # Scope (A3-14): every library unit test in the modules that contain
  # `unsafe` code or that are cheap enough to interpret. Tests that call
  # FFI Miri cannot model (mlock, dladdr) are `#[cfg_attr(miri, ignore)]`.
  # Modules with expensive key generation / PBKDF2 (pairwise_test,
  # self_test, store::backup) are excluded because Miri is ~1000x slower.
  # The exported PKCS#11 entry points are exercised by integration tests,
  # which Miri does not run; unit tests for the ABI helpers (template
  # parsing, buffer handling) under `pkcs11_abi::` are picked up
  # automatically as they are added.
  miri:
    name: Miri (Undefined Behavior Check)
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust nightly + Miri
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: nightly
          components: miri, rust-src

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run Miri on library unit tests
        run: >-
          cargo +nightly miri test --locked --lib --
          --test-threads=1
          crypto::digest
          crypto::integrity
          crypto::drbg
          crypto::mlock
          session::
          pkcs11_abi::
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-symbolic-alignment-check"

  # ── Fuzz smoke test: every target builds and runs for 60 s (A3-13) ──
  fuzz-smoke:
    name: Fuzz smoke (60 s per target)
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-fuzz

      - name: Build all fuzz targets
        run: cargo +nightly fuzz build --fuzz-dir fuzz

      - name: Run every fuzz target for 60 s
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30

  # ── Helm chart must lint and render (A3-09) ──
  helm:
    name: Helm lint & template
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm lint
        run: helm lint deploy/helm/craton-hsm

      - name: helm template
        run: helm template ci deploy/helm/craton-hsm > /dev/null

  # ── Benchmarks: main-only, compare Craton HSM vs SoftHSMv2 ──
  benchmarks:
    name: Benchmarks (PKCS#11 ABI)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install SoftHSMv2
        run: sudo apt-get update && sudo apt-get install -y softhsm2

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Build release library
        run: cargo build --locked --release --lib

      - name: Run ABI benchmarks (Craton HSM vs SoftHSMv2)
        run: SOFTHSM2_LIB=/usr/lib/softhsm/libsofthsm2.so cargo bench --locked --bench pkcs11_abi_bench

      - name: Upload benchmark reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: criterion-reports
          path: target/criterion/
          retention-days: 30

  # ── Documentation build (GitHub Pages deployment lives in docs.yml, push-only) ──
  docs:
    name: Documentation
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Build documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs"

  # ── Code Coverage ──
  coverage:
    name: Code Coverage
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage report
        run: cargo tarpaulin --locked --out xml --out html --skip-clean --timeout 300 --exclude-files 'tests/fips_*' -- --test-threads=1
        timeout-minutes: 30
        env:
          RUST_BACKTRACE: 1

      - name: Upload to Codecov
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5.5.3
        if: always()
        with:
          files: cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: |
            tarpaulin-report.html
            cobertura.xml
          retention-days: 30
