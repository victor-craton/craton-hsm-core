name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Re-used by the release workflow as a mandatory gate (A3-03).
  workflow_call:

# Least privilege by default (A3-10). Jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must match rust-toolchain.toml (checked by the `fmt-check` job, A3-08).
  RUST_TOOLCHAIN: "1.94.1"
  # Declared MSRV — must match `rust-version` in Cargo.toml.
  RUST_MSRV: "1.89.0"
  # Pinned protoc for the daemon build script (A3-27).
  PROTOC_VERSION: "36.2"

jobs:
  # ── Fast gate: formatting + CI self-consistency checks ──
  fmt-check:
    name: Format & CI consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Toolchain pin matches rust-toolchain.toml and Cargo.toml
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          if [ "$pinned" != "$RUST_TOOLCHAIN" ]; then
            echo "::error file=rust-toolchain.toml::channel '$pinned' != RUST_TOOLCHAIN '$RUST_TOOLCHAIN' in ci.yml"
            exit 1
          fi
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$RUST_MSRV" in
            "$msrv"|"$msrv".*) ;;
            *) echo "::error file=Cargo.toml::rust-version '$msrv' != RUST_MSRV '$RUST_MSRV' in ci.yml"; exit 1 ;;
          esac

      - name: Every integration test file is run by CI
        # Guards against new tests/*.rs files that are silently never executed.
        run: |
          set -euo pipefail
          missing=0
          for f in tests/*.rs; do
            name=$(basename "$f" .rs)
            if ! grep -qE -- "--test ${name}\$" .github/workflows/ci.yml; then
              echo "::error file=$f::integration test '$name' is not listed in .github/workflows/ci.yml"
              missing=1
            fi
          done
          exit $missing

  # ── Build & Test: full OS matrix on main/release, Ubuntu-only on PRs ──
  #
  # Tests are split into two groups for performance:
  #   1. Parallel-safe: pure crypto / unit tests with no global state
  #   2. Serial: PKCS#11 ABI tests sharing a process-wide singleton
  #
  # PKCS#11 §5.10 mandates one C_Initialize/C_Finalize per process, so ABI
  # tests must run with --test-threads=1. Pure crypto tests are stateless and
  # safe to parallelize. The `fmt-check` job verifies that every tests/*.rs
  # file appears in one of the two lists below.
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: fmt-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned runner images = the tested operational environments listed in
        # docs/tested-platforms.md and docs/fips-140-3-certification.md §5 (A1-19).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "windows-2025", "macos-15"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run parallel-safe tests (pure crypto, no global state)
        run: >-
          cargo test --locked --lib
          --test crypto_vectors
          --test drbg_tests
          --test concurrent_stress
          --test audit_and_integrity
          --test integrity_tests
          --test multi_slot
          --
          --test-threads=8

      - name: Run PKCS#11 ABI tests (serial — global singleton)
        # `zeroization` runs here (serially) because it inspects memory after
        # drop and is sensitive to allocator reuse by concurrent tests (A3-21).
        run: >-
          cargo test --locked
          --test abi_security_regressions
          --test attribute_management
          --test attribute_validation
          --test backup_restore
          --test concurrent_session_stress
          --test crypto_abi_params
          --test crypto_vectors_phase2
          --test digest_abi
          --test fips_approved_mode
          --test key_derivation_abi
          --test key_lifecycle_abi
          --test key_wrapping_abi
          --test multipart_encrypt_decrypt
          --test multipart_sign_verify
          --test negative_edge_cases
          --test operation_state
          --test pairwise_consistency
          --test persistence
          --test pkcs11_compliance
          --test pkcs11_compliance_extended
          --test pkcs11_conformance
          --test pkcs11_error_paths
          --test pkcs11_info_functions
          --test pqc_abi_comprehensive
          --test pqc_phase3
          --test random_and_session
          --test rsa_abi_comprehensive
          --test security_properties
          --test session_state_machine
          --test state_regressions
          --test supplementary_functions
          --test zeroization
          --
          --test-threads=1

      - name: Run doc-tests
        run: cargo test --locked --doc -p craton-hsm

      - name: Build the craton-hsm cdylib for the spy integration test
        # tools/pkcs11-spy/tests/spy_integration.rs wraps the real
        # target/debug/libcraton_hsm.{so,dylib} (or craton_hsm.dll) and only
        # prints SKIPPED when it has not been built (H6-17).
        run: cargo build --locked -p craton-hsm --lib

      - name: Run workspace member tests
        run: >-
          cargo test --locked
          -p craton-hsm-admin
          -p pkcs11-spy
          -p craton-hsm-daemon
          --
          --test-threads=1

  # ── Feature matrix: the FIPS / AWS-LC configurations must build AND pass ──
  # (A1-20: CI previously never compiled `fips` or `awslc-backend`; H2-05 /
  # crypto handoff: the AWS-LC backend has its own CASTs and a cross-backend
  # differential test that only run with the feature enabled.)
  # `fips` implies `awslc-backend`. The recommended FIPS build is
  # `--no-default-features --features fips` (RustCrypto backend not compiled).
  features:
    name: Features (${{ matrix.name }})
    needs: fmt-check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: awslc-backend
            flags: --features awslc-backend
            sign: false
          - name: fips
            flags: --features fips
            sign: true
          - name: fips only (release flavour)
            flags: --no-default-features --features fips
            sign: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          key: features-${{ matrix.name }}

      - name: Ephemeral integrity key (fips builds fail closed without a valid .sig)
        # `fips` builds refuse to start with the placeholder key or without a
        # `.sig` sidecar next to the module (A1-05). The test executables are
        # the "module" here, so they are signed with a throw-away key that is
        # embedded at build time. Release builds use the real key (release.yml).
        if: matrix.sign
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/ci-integrity.pem"
          pub=$(openssl pkey -in "$RUNNER_TEMP/ci-integrity.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          echo "CRATON_HSM_INTEGRITY_PUBLIC_KEY=$pub" >> "$GITHUB_ENV"

      - name: Build library, tests, benches and examples
        # aws-lc-fips-sys needs cmake, Go and a C compiler (preinstalled on
        # the ubuntu-24.04 runner image).
        run: cargo build --locked -p craton-hsm ${{ matrix.flags }} --all-targets

      - name: Build (and for fips, sign) the test executables
        run: |
          set -euo pipefail
          cargo test --locked -p craton-hsm ${{ matrix.flags }} \
            --lib --test fips_approved_mode --test crypto_vectors \
            --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' \
            > "$RUNNER_TEMP/test-executables.txt"
          cat "$RUNNER_TEMP/test-executables.txt"
          if [ "${{ matrix.sign }}" = "true" ]; then
            while read -r exe; do
              bash tools/sign-integrity.sh "$exe" "$RUNNER_TEMP/ci-integrity.pem"
            done < "$RUNNER_TEMP/test-executables.txt"
          fi

      - name: Library unit tests (POST/CASTs, integrity, DRBG, AWS-LC differential tests)
        run: cargo test --locked -p craton-hsm ${{ matrix.flags }} --lib -- --test-threads=1

      - name: Approved-mode ABI tests (serial)
        run: >-
          cargo test --locked -p craton-hsm ${{ matrix.flags }}
          --test fips_approved_mode
          --test crypto_vectors
          --
          --test-threads=1

  # ── MSRV: the declared rust-version must actually build (A3-08) ──
  msrv:
    name: MSRV check
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_MSRV }}

      - name: cargo check with the MSRV toolchain
        # `+toolchain` overrides rust-toolchain.toml for this invocation.
        run: cargo +${{ env.RUST_MSRV }} check --locked --workspace

  # ── Clippy: blocking for correctness + suspicious ──
  lint:
    name: Clippy
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run Clippy
        # Deny correctness and suspicious lints (safety-critical for a crypto
        # project) on all targets. Other categories remain warnings until the
        # pre-existing issues are resolved. `clippy::not_unsafe_ptr_arg_deref`
        # (safe `extern "C"` fns dereferencing raw pointers) and
        # `clippy::incompatible_msrv` are deliberately NOT allowed any more
        # (A3-14, A3-08).
        run: >-
          cargo clippy --locked --workspace --all-targets --
          -D clippy::correctness -D clippy::suspicious
          -A deprecated

  # ── Semver Checks: catch accidental breaking changes ──
  semver-checks:
    name: Semver Compliance
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check semver compliance
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: craton-hsm
        continue-on-error: true  # Reported but non-blocking until 1.0

  # ── Miri: undefined-behavior checks ──
  #
  # Scope (A3-14): every library unit test in the modules that contain
  # `unsafe` code or that are cheap enough to interpret. Tests that call
  # FFI Miri cannot model (mlock, dladdr) are `#[cfg_attr(miri, ignore)]`.
  # Modules with expensive key generation / PBKDF2 (pairwise_test,
  # self_test, store::backup) are excluded because Miri is ~1000x slower.
  # The exported PKCS#11 entry points are exercised by integration tests,
  # which Miri does not run; unit tests for the ABI helpers (template
  # parsing, buffer handling) under `pkcs11_abi::` are picked up
  # automatically as they are added.
  miri:
    name: Miri (Undefined Behavior Check)
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust nightly + Miri
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: nightly
          components: miri, rust-src

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run Miri on library unit tests
        run: >-
          cargo +nightly miri test --locked --lib --
          --test-threads=1
          crypto::digest
          crypto::integrity
          crypto::drbg
          crypto::mlock
          session::
          pkcs11_abi::
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-symbolic-alignment-check"

  # ── Fuzz smoke test: every target builds and runs for 60 s (A3-13) ──
  fuzz-smoke:
    name: Fuzz smoke (60 s per target)
    needs: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-fuzz

      - name: Build all fuzz targets
        run: cargo +nightly fuzz build --fuzz-dir fuzz

      - name: Run every fuzz target for 60 s
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30

  # ── Helm chart must lint and render (A3-09) ──
  helm:
    name: Helm lint & template
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm lint (strict)
        # The chart refuses to render without mTLS configuration (by design),
        # so lint/template with a client-CA secret name set. `--strict` turns
        # lint warnings into failures (A3-09, H4-23).
        run: helm lint --strict deploy/helm/craton-hsm --set tls.clientCaSecretName=ci-client-ca

      - name: helm template
        run: helm template ci deploy/helm/craton-hsm --set tls.clientCaSecretName=ci-client-ca > /dev/null

      - name: Insecure configurations must refuse to render
        run: |
          set -u
          if helm template ci deploy/helm/craton-hsm > /dev/null 2>&1; then
            echo "::error::chart rendered with TLS but without mTLS configuration"; exit 1
          fi
          if helm template ci deploy/helm/craton-hsm --set tls.enabled=false --set tls.clientCaSecretName=x > /dev/null 2>&1; then
            echo "::error::chart rendered with TLS disabled and no acknowledgement"; exit 1
          fi

  # ── Container image: deploy/Dockerfile must build, and the daemon in it
  # must accept the configuration rendered by the Helm chart (A3-09, H4-23) ──
  container:
    name: Container image & rendered Helm config
    needs: fmt-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: docker build (BuildKit, repository root as context)
        env:
          DOCKER_BUILDKIT: "1"
        # The Dockerfile runs the crypto self-tests (KATs) during the build.
        run: docker build --pull -f deploy/Dockerfile -t craton-hsm:ci .

      - name: Image runs as the distroless non-root user and ships both binaries
        run: |
          set -euo pipefail
          user=$(docker image inspect craton-hsm:ci --format '{{.Config.User}}')
          if [ "$user" != "65532:65532" ]; then
            echo "::error file=deploy/Dockerfile::image user is '$user', expected 65532:65532"; exit 1
          fi
          docker run --rm --entrypoint /usr/local/bin/craton-hsm-admin craton-hsm:ci --version
          docker run --rm --entrypoint /usr/local/bin/craton-hsm-daemon craton-hsm:ci --help >/dev/null 2>&1 || true

      - name: Render the chart's craton_hsm.toml
        run: |
          set -euo pipefail
          helm template ci deploy/helm/craton-hsm \
            --set tls.clientCaSecretName=ci-client-ca \
            --set persistence.enabled=true \
            --show-only templates/configmap.yaml > "$RUNNER_TEMP/configmap.yaml"
          python3 - "$RUNNER_TEMP/configmap.yaml" "$RUNNER_TEMP/craton_hsm.toml" <<'PY'
          import sys, tomllib
          lines = open(sys.argv[1]).read().splitlines()
          start = next(i for i, l in enumerate(lines) if l.strip() == "craton_hsm.toml: |")
          indent = None
          out = []
          for line in lines[start + 1:]:
              if not line.strip():
                  out.append("")
                  continue
              cur = len(line) - len(line.lstrip(" "))
              if indent is None:
                  indent = cur
              if cur < indent:
                  break
              out.append(line[indent:])
          text = "\n".join(out).rstrip() + "\n"
          tomllib.loads(text)  # must at least be valid TOML
          open(sys.argv[2], "w").write(text)
          PY
          cat "$RUNNER_TEMP/craton_hsm.toml"

      - name: Daemon accepts the rendered config (strict parse + validation + POST)
        # The daemon parses the file strictly (unknown keys are fatal) and
        # validates it before running the self-tests; reaching "POST
        # self-tests passed" proves the chart and the daemon agree. It then
        # stops because the TLS secrets are not mounted, which is expected.
        run: |
          set -uo pipefail
          # The core refuses config files not owned by the service user or root.
          sudo chown root:root "$RUNNER_TEMP/craton_hsm.toml"
          sudo chmod 0444 "$RUNNER_TEMP/craton_hsm.toml"
          timeout 120 docker run --rm \
            -v "$RUNNER_TEMP/craton_hsm.toml:/etc/craton-hsm/craton_hsm.toml:ro" \
            craton-hsm:ci > "$RUNNER_TEMP/daemon.log" 2>&1
          echo "daemon exit status: $?"
          cat "$RUNNER_TEMP/daemon.log"
          if ! grep -q "POST self-tests passed" "$RUNNER_TEMP/daemon.log"; then
            echo "::error file=deploy/helm/craton-hsm/templates/configmap.yaml::rendered configuration rejected by craton-hsm-daemon"
            exit 1
          fi

  # ── Benchmarks: main-only, compare Craton HSM vs SoftHSMv2 ──
  benchmarks:
    name: Benchmarks (PKCS#11 ABI)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install SoftHSMv2
        run: sudo apt-get update && sudo apt-get install -y softhsm2

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Build release library
        run: cargo build --locked --release --lib

      - name: Run ABI benchmarks (Craton HSM vs SoftHSMv2)
        run: SOFTHSM2_LIB=/usr/lib/softhsm/libsofthsm2.so cargo bench --locked --bench pkcs11_abi_bench

      - name: Upload benchmark reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: criterion-reports
          path: target/criterion/
          retention-days: 30

  # ── Documentation build (GitHub Pages deployment lives in docs.yml, push-only) ──
  docs:
    name: Documentation
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Build documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs"

  # ── Code Coverage ──
  coverage:
    name: Code Coverage
    needs: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable branch; version set by `toolchain`
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage report
        run: cargo tarpaulin --locked --out xml --out html --skip-clean --timeout 300 --exclude-files 'tests/fips_*' -- --test-threads=1
        timeout-minutes: 30
        env:
          RUST_BACKTRACE: 1

      - name: Upload to Codecov
        uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5.5.3
        if: always()
        with:
          files: cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: |
            tarpaulin-report.html
            cobertura.xml
          retention-days: 30
